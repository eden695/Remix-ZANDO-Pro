<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ZANDO Pro — Gestion Commerciale Offline-First</title>
    <meta
      name="description"
      content="Application professionnelle Offline-First de gestion commerciale et génération de catalogues autonomes pour vendeurs WhatsApp, Facebook et Instagram."
    />
    <meta property="og:title" content="ZANDO Pro — Gestion Commerciale Offline-First" />
    <meta
      property="og:description"
      content="Gérez vos produits, ventes, commandes, clients, promotions et catalogues HTML/PDF autonomes sans connexion obligatoire."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZANDO Pro" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var timer = window.setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.children.length > 0) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui,-apple-system,sans-serif">' +
            '<h1 style="font-size:18px;font-weight:700;margin:0 0 8px">ZANDO Pro</h1>' +
            '<p style="font-size:14px;color:#64748b;margin:0 0 16px;max-width:340px">Le démarrage prend plus de temps que prévu sur ce WebView.</p>' +
            '<button type="button" onclick="window.location.reload()" style="min-height:44px;padding:0 20px;border-radius:12px;border:none;background:#0f172a;color:#fff;font-weight:600;font-size:14px;cursor:pointer">Relancer</button>' +
            '</div>';
        }, 6000);
        window.addEventListener('DOMContentLoaded', function () {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) window.clearTimeout(timer);
        });
      })();
    </script>
  </body>
</html>
