name: Deploy ZANDO Pro to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Typecheck TypeScript
        run: npm run lint

      - name: Build production bundle
        env:
          VITE_CATALOG_API_URL: ${{ vars.VITE_CATALOG_API_URL }}
        run: |
          RAW_BASE="${{ steps.pages.outputs.base_path }}"
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_BASE" ]; then
            if [ -z "$REPO_NAME" ] || [[ "$REPO_NAME" == *.github.io ]]; then
              RAW_BASE="/"
            else
              RAW_BASE="/$REPO_NAME"
            fi
          fi
          if [ "$RAW_BASE" = "/" ]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="${RAW_BASE%/}/"
          fi
          echo "Building ZANDO Pro with VITE_BASE_PATH=$VITE_BASE_PATH"
          npm run build

      - name: Prepare GitHub Pages artifacts (.nojekyll & 404.html)
        run: |
          touch dist/.nojekyll
          if [ -f dist/index.html ]; then
            cp dist/index.html dist/404.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
